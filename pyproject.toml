[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-marl"
version = "1.3.1"
description = "Reproducible cooperative rover coordination under disruptions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  {name = "DART-MARL research team"}
]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
train = ["torch>=2.4"]
plots = ["matplotlib>=3.8"]
demo = ["Pillow>=10"]

[project.scripts]
dart-marl = "dart_marl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
