# iteration (historical): registered full study. Never change this file after init.
# Original R-CART is primary; bounded-sync and no-sync are SECONDARY.
# Seeds 11/22/33 (development), 42 (historical) are excluded.
schema_version: 1
name: primary_study_full_fresh_10_seeds_confirmatory
training_variants:
  nominal: configs/train/mappo_team_value.yaml
  fault_robust: configs/train/mappo_fault_robust.yaml
training_environment: configs/env/dev_roles.yaml
training_seeds: [101, 202, 303, 404, 505, 606, 707, 808, 909, 1010]
validation_scenarios:
  - configs/env/dev_failure.yaml
  - configs/env/analytic_repeated_faults.yaml
  - configs/env/critic_fault_shift_dev.yaml
# Fresh iteration (historical) fault schedule: held out from all engineering/test rollouts.
# Both the old iteration (historical) and iteration (historical) TEST_ONLY schedules were exercised by engineering tests.
test_scenarios:
  - configs/env/primary_study_final_test_only.yaml
checkpoint_selection:
  episodes: 4
  seed: 840000
  device: cpu
  criterion: relative_critic_rmse
allocation:
  methods:
    - fixed
    - greedy
    - switch_aware
    - r_cart
    - r_cart_bounded_sync
    - r_cart_no_sync
    - r_cart_no_switch
    - r_cart_no_hysteresis
    - cft
    - cft_rank
  episodes: 8
  development_seed: 980000
  test_seed: 1980000
  forecast_horizon: 24
  device: auto
statistics:
  bootstrap_seed: 271828
  bootstrap_replicates: 4000
cft:
  train_episodes: 24
  val_episodes: 6
  test_episodes: 6
  seed_base: 710000
  event_mode: diverse
  device: cpu
  sample_period: 8
  candidates: 6
  beam: 200
  model_seed: 123
  epochs: 120
  patience: 20
  rank_weight: 0.65
  rank_temperature: 5.0
primary_method: r_cart
confirmatory:
  primary_variant: fault_robust
  primary_scenario: configs/env/primary_study_final_test_only.yaml
  primary_method: r_cart
  baseline_method: switch_aware
  primary_metric: mean_return
  minimum_training_seeds: 10
