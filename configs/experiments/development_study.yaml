# Development study. DO NOT use the predeclared TEST_ONLY scenario here.
schema_version: 1
name: study_cohort_1
training_variants:
  nominal: configs/train/mappo_team_value.yaml
  fault_robust: configs/train/mappo_fault_robust.yaml
training_environment: configs/env/dev_roles.yaml
training_seeds: [11, 22, 33, 44, 55]
validation_scenarios:
  - configs/env/dev_failure.yaml
  - configs/env/analytic_repeated_faults.yaml
  - configs/env/critic_fault_shift_dev.yaml
test_scenarios:
  - configs/env/historical_fault_stress.yaml
checkpoint_selection:
  episodes: 4
  seed: 840000
  device: cpu
  criterion: relative_critic_rmse
allocation:
  methods: [fixed, greedy, switch_aware, r_cart, r_cart_no_sync, r_cart_no_switch, r_cart_no_hysteresis]
  episodes: 8
  development_seed: 980000
  test_seed: 1980000
  forecast_horizon: 24
  device: auto
statistics:
  bootstrap_seed: 271828
  bootstrap_replicates: 4000
