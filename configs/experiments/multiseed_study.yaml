# Full predeclared study. CFT must be retrained for EACH selected controller.
schema_version: 1
name: study_full_preregistered_10_training_seeds
training_variants:
  nominal: configs/train/mappo_team_value.yaml
  fault_robust: configs/train/mappo_fault_robust.yaml
training_environment: configs/env/dev_roles.yaml
training_seeds:
- 11
- 22
- 33
- 44
- 55
- 66
- 77
- 88
- 99
- 110
validation_scenarios:
- configs/env/dev_failure.yaml
- configs/env/analytic_repeated_faults.yaml
- configs/env/critic_fault_shift_dev.yaml
test_scenarios:
- configs/env/historical_fault_stress.yaml
- configs/env/historical_stress_test.yaml
checkpoint_selection:
  episodes: 4
  seed: 840000
  device: cpu
  criterion: relative_critic_rmse
allocation:
  methods:
  - fixed
  - greedy
  - switch_aware
  - r_cart
  - r_cart_no_sync
  - r_cart_no_switch
  - r_cart_no_hysteresis
  - cft
  - cft_rank
  episodes: 8
  development_seed: 980000
  test_seed: 1980000
  forecast_horizon: 24
  device: auto
statistics:
  bootstrap_seed: 271828
  bootstrap_replicates: 4000
cft:
  train_episodes: 24
  val_episodes: 6
  test_episodes: 6
  seed_base: 710000
  event_mode: diverse
  device: cpu
  sample_period: 8
  candidates: 6
  beam: 200
  model_seed: 123
  epochs: 120
  patience: 20
  rank_weight: 0.65
  rank_temperature: 5.0
