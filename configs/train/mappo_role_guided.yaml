schema_version: 1
env_config: configs/env/dev_roles.yaml
seed: 42
device: auto
num_envs: 8
rollout_steps: 64
total_env_steps: 32768
hidden_size: 128
role_mode: initial_coupling
# TRAINING VARIANT: NOT vanilla MAPPO. Fixed role-target steering is part
# of the actor's Gaussian mean and log probability, NOT an external override.
# Preserve configs/train/mappo_role.yaml as the unshaped vanilla comparison.
role_guidance_gain: 2.0
# Optional PBRS, raw task return ALWAYS used in evaluation.
# Keep OFF initially to isolate effect of the actor role prior.
shaping_coef: 0.0
eval_episodes: 8
eval_every: 8
save_every: 8
torch_threads: 2
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  learning_rate: 0.0003
  ppo_epochs: 5
  num_minibatches: 4
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  value_clip: null
