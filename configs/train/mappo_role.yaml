schema_version: 1
env_config: configs/env/dev_roles.yaml
seed: 42
device: auto
num_envs: 8
rollout_steps: 64
total_env_steps: 32768
hidden_size: 128
role_mode: initial_coupling
# PBRS is optional and changes training reward; evaluate ALWAYS uses raw task reward.
# Keep 0 for the unshaped MAPPO baseline. Tune only on train/validation scenarios.
shaping_coef: 0.0
eval_episodes: 8
eval_every: 8
save_every: 8
torch_threads: 2
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  learning_rate: 0.0003
  ppo_epochs: 5
  num_minibatches: 4
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  value_clip: null
