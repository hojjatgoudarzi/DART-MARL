schema_version: 1
env_config: configs/env/dev_roles.yaml
seed: 42
device: auto
num_envs: 8
rollout_steps: 64
total_env_steps: 32768
hidden_size: 128
role_mode: initial_coupling
role_guidance_gain: 2.0
shaping_coef: 0.0
critic_arch: agent_v1
treat_horizon_as_terminal: true
eval_episodes: 8
eval_every: 8
save_every: 8
torch_threads: 2
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  learning_rate: 0.0003
  critic_learning_rate: 0.0005
  value_target_scale: 1.0
  ppo_epochs: 5
  num_minibatches: 4
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  value_clip: null
